<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1250" viewBox="0 0 2200 1250">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#55738d"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#93a3b2"/>
    </marker>
    <marker id="arrowRepair" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#bd756e"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #21384b; letter-spacing: .1px; }
      .kicker { font: 700 14px Arial, Helvetica, sans-serif; fill: #6e8395; letter-spacing: 2px; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #607487; }
      .section { font: 700 18px Arial, Helvetica, sans-serif; fill: #31556e; letter-spacing: .8px; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #243c50; }
      .body { font: 400 15px Arial, Helvetica, sans-serif; fill: #40586b; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #6c7f90; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #718394; }
      .math { font: 400 15px Georgia, 'Times New Roman', serif; fill: #375873; }
      .pill { font: 700 13px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: .8px; }
      .card { stroke: #b8c7d2; stroke-width: 1.5; }
      .panel { stroke: #d3dfe7; stroke-width: 1.5; }
      .flow { fill: none; stroke: #55738d; stroke-width: 2.8; marker-end: url(#arrow); }
      .mutedFlow { fill: none; stroke: #93a3b2; stroke-width: 2.1; marker-end: url(#arrowMuted); }
      .dashedFlow { fill: none; stroke: #93a3b2; stroke-width: 2.1; stroke-dasharray: 8 8; marker-end: url(#arrowMuted); }
      .repairFlow { fill: none; stroke: #bd756e; stroke-width: 2.8; marker-end: url(#arrowRepair); }
      .hairline { stroke: #dbe4ea; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="2200" height="1250" fill="#ffffff"/>
  <text x="90" y="57" class="kicker">VLCoT  |  METHOD OVERVIEW</text>
  <text x="90" y="101" class="title">Stage-Verifiable Latent Chain-of-Thought with Local Repair</text>
  <text x="90" y="132" class="subtitle">Execution evidence determines which latent stages remain valid and where computation resumes.</text>
  <rect x="1830" y="72" width="270" height="46" rx="23" fill="#edf3f7" stroke="#bdccd6"/>
  <text x="1872" y="101" class="label">C_total &lt;= B</text>
  <line x1="90" y1="160" x2="2110" y2="160" class="hairline"/>

  <rect x="90" y="188" width="2020" height="184" rx="20" fill="#fbfcfd" class="panel"/>
  <text x="122" y="222" class="section">OFFLINE SEMANTIC ALIGNMENT</text>
  <text x="122" y="247" class="small">Demonstration events provide observable meanings for continuous latent stages.</text>

  <rect x="122" y="275" width="300" height="66" rx="13" fill="#eaf2f6" class="card"/>
  <circle cx="155" cy="308" r="17" fill="#91b5c2"/>
  <path d="M146 309h18M155 300v18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="185" y="303" class="label">Demonstrations</text>
  <text x="185" y="326" class="small">images | actions | trajectories</text>

  <rect x="492" y="275" width="300" height="66" rx="13" fill="#f5efe2" class="card"/>
  <circle cx="525" cy="308" r="17" fill="#d2b681"/>
  <path d="M517 315l7-14 9 8-7 14z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="555" y="303" class="label">Stage Targets</text>
  <text x="555" y="326" class="small">relations + subgoal events</text>

  <rect x="862" y="275" width="364" height="66" rx="13" fill="#eeeaf7" class="card"/>
  <circle cx="895" cy="308" r="17" fill="#aaa1ca"/>
  <path d="M886 302h18M886 308h18M886 314h13" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
  <text x="925" y="303" class="label">Latent Stage Alignment</text>
  <text x="925" y="326" class="math">s_hat_i = Dpsi(Z_i)  |  masked L_stage</text>

  <rect x="1296" y="275" width="364" height="66" rx="13" fill="#e6f2ef" class="card"/>
  <circle cx="1329" cy="308" r="17" fill="#82b4aa"/>
  <path d="M1321 309l6 6 11-13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1359" y="303" class="label">Observation Estimation</text>
  <text x="1359" y="326" class="math">s_tilde_t = Veta(o_[t-w:t], g)</text>

  <rect x="1730" y="275" width="348" height="66" rx="13" fill="#f0f3f7" class="card"/>
  <text x="1762" y="303" class="label">Joint Training</text>
  <text x="1762" y="326" class="small">action | stage | observation losses</text>

  <path d="M422 308 H492" class="mutedFlow"/>
  <path d="M792 308 H862" class="mutedFlow"/>
  <path d="M1226 308 H1296" class="mutedFlow"/>
  <path d="M1660 308 H1730" class="mutedFlow"/>
  <path d="M1044 341 V418" class="dashedFlow"/>
  <path d="M1478 341 V418" class="dashedFlow"/>
  <text x="1060" y="401" class="tiny">initializes online modules</text>

  <rect x="90" y="418" width="2020" height="734" rx="20" fill="#ffffff" class="panel"/>
  <text x="122" y="455" class="section">ONLINE CLOSED-LOOP EXECUTION</text>
  <text x="122" y="480" class="small">Short action chunks alternate with observation, verification, and selective regeneration.</text>

  <rect x="122" y="520" width="280" height="142" rx="16" fill="#eaf2f6" class="card"/>
  <circle cx="163" cy="561" r="20" fill="#91b5c2"/>
  <path d="M154 561h18M163 552v18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <text x="197" y="555" class="label">Task Context</text>
  <text x="197" y="580" class="body">instruction g</text>
  <text x="197" y="602" class="body">observation o_t</text>
  <text x="197" y="624" class="body">verified history M_t</text>
  <text x="197" y="647" class="math">h_t = E(g, o_t, M_t)</text>

  <rect x="462" y="520" width="405" height="142" rx="16" fill="#eeeaf7" class="card"/>
  <text x="493" y="555" class="label">Latent Stage Chain</text>
  <text x="493" y="581" class="small">continuous segments with stage semantics</text>
  <g transform="translate(493 601)">
    <rect x="0" y="0" width="62" height="34" rx="8" fill="#c9c1df"/>
    <rect x="74" y="0" width="62" height="34" rx="8" fill="#b9afd5"/>
    <rect x="148" y="0" width="62" height="34" rx="8" fill="#aaa0ca"/>
    <rect x="222" y="0" width="82" height="34" rx="8" fill="#9d93bd"/>
    <text x="18" y="22" class="pill">Z_1</text>
    <text x="92" y="22" class="pill">Z_2</text>
    <text x="166" y="22" class="pill">Z_k</text>
    <text x="235" y="22" class="pill">Z_k:K</text>
  </g>
  <text x="493" y="651" class="math">active stage k  |  retain valid prefix</text>

  <rect x="927" y="520" width="280" height="142" rx="16" fill="#edf3f7" class="card"/>
  <circle cx="967" cy="560" r="20" fill="#86a6c3"/>
  <path d="M957 565l10-18 10 18M963 565h8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round"/>
  <text x="1000" y="555" class="label">Action Policy</text>
  <text x="1000" y="581" class="body">pi_phi( . | o_t, g, M_t,</text>
  <text x="1000" y="603" class="math">Z_k:K )</text>
  <text x="1000" y="636" class="small">decode H-step chunk</text>

  <rect x="1267" y="520" width="280" height="142" rx="16" fill="#f7eee7" class="card"/>
  <circle cx="1307" cy="560" r="20" fill="#d3a38a"/>
  <path d="M1298 558h18M1302 565h10M1306 572h3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1340" y="555" class="label">Environment</text>
  <text x="1340" y="581" class="body">execute h steps</text>
  <text x="1340" y="604" class="body">scene transition</text>
  <text x="1340" y="636" class="small">physical outcome</text>

  <rect x="1607" y="520" width="440" height="142" rx="16" fill="#e6f2ef" class="card"/>
  <circle cx="1647" cy="560" r="20" fill="#82b4aa"/>
  <path d="M1637 564l7-11 7 11 7-11" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1680" y="555" class="label">Observation-based Verification</text>
  <text x="1680" y="581" class="body">compare expected s_hat_k with observed s_tilde_t</text>
  <text x="1680" y="604" class="body">consecutive evidence + conditions</text>
  <text x="1680" y="636" class="small">supported | uncertain | contradiction</text>

  <path d="M402 591 H462" class="flow"/>
  <path d="M867 591 H927" class="flow"/>
  <path d="M1207 591 H1267" class="flow"/>
  <path d="M1547 591 H1607" class="flow"/>

  <line x1="122" y1="709" x2="2047" y2="709" class="hairline"/>
  <text x="122" y="744" class="kicker">VERIFICATION OUTCOMES</text>

  <rect x="122" y="770" width="480" height="232" rx="17" fill="#eef7f1" class="card"/>
  <rect x="122" y="770" width="480" height="44" rx="17" fill="#8db8a3"/>
  <text x="151" y="799" class="pill">SUPPORTED COMPLETION</text>
  <circle cx="165" cy="858" r="18" fill="#8db8a3"/>
  <path d="M156 858l6 6 11-13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="201" y="855" class="label">Advance stage k -&gt; k + 1</text>
  <text x="201" y="882" class="body">update verified history</text>
  <text x="201" y="906" class="body">retain Z_(1:k-1) and extend window</text>
  <text x="151" y="960" class="small">valid progress is reused</text>
  <path d="M362 770 C362 730 625 730 625 662" class="mutedFlow"/>

  <rect x="650" y="770" width="480" height="232" rx="17" fill="#fbf7eb" class="card"/>
  <rect x="650" y="770" width="480" height="44" rx="17" fill="#c9b77f"/>
  <text x="679" y="799" class="pill">INSUFFICIENT EVIDENCE</text>
  <circle cx="693" cy="858" r="18" fill="#c9b77f"/>
  <path d="M693 847v14M693 867v2" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="729" y="855" class="label">Keep stage unconfirmed</text>
  <text x="729" y="882" class="body">wait for more reliable observations</text>
  <text x="729" y="906" class="body">do not advance or certify</text>
  <text x="679" y="960" class="small">missing evidence != failure</text>
  <path d="M890 770 C890 722 1827 722 1827 662" class="dashedFlow"/>

  <rect x="1178" y="770" width="869" height="232" rx="17" fill="#fbefed" class="card"/>
  <rect x="1178" y="770" width="869" height="44" rx="17" fill="#c48780"/>
  <text x="1207" y="799" class="pill">PERSISTENT DEVIATION  |  DEPENDENCY-AWARE LOCAL REPAIR</text>
  <text x="1207" y="854" class="label">1. Check still-required prerequisites</text>
  <text x="1207" y="881" class="label">2. Find earliest affected stage j</text>
  <text x="1207" y="908" class="label">3. Retain Z_(1:j-1)  |  regenerate Z'_j:K</text>
  <text x="1207" y="960" class="small">condition suffix on current o_t and valid M_t</text>
  <g transform="translate(1794 839)">
    <rect x="0" y="0" width="54" height="32" rx="7" fill="#a8c9bb"/>
    <rect x="64" y="0" width="54" height="32" rx="7" fill="#a8c9bb"/>
    <rect x="128" y="0" width="54" height="32" rx="7" fill="#d49389"/>
    <rect x="192" y="0" width="54" height="32" rx="7" fill="#d6c3ca"/>
    <text x="14" y="21" class="pill">Z_1</text>
    <text x="78" y="21" class="pill">Z_2</text>
    <text x="141" y="21" class="pill">Z_j</text>
    <text x="204" y="21" class="pill">Z'</text>
    <path d="M54 16 H64 M118 16 H128 M182 16 H192" stroke="#bd756e" stroke-width="2" marker-end="url(#arrowRepair)"/>
  </g>
  <path d="M1827 662 C1827 705 1614 705 1614 770" class="repairFlow"/>
  <path d="M1614 1002 C1614 1080 670 1080 670 662" class="repairFlow"/>
  <rect x="122" y="1050" width="1280" height="66" rx="15" fill="#f7fafc" stroke="#d3dfe7"/>
  <text x="151" y="1080" class="kicker">VISUAL LEGEND</text>
  <rect x="315" y="1068" width="18" height="18" rx="5" fill="#c9c1df"/>
  <text x="345" y="1082" class="small">latent stage</text>
  <rect x="485" y="1068" width="18" height="18" rx="5" fill="#82b4aa"/>
  <text x="515" y="1082" class="small">observation / verification</text>
  <rect x="740" y="1068" width="18" height="18" rx="5" fill="#d49389"/>
  <text x="770" y="1082" class="small">repair</text>
  <line x1="885" y1="1077" x2="927" y2="1077" stroke="#55738d" stroke-width="2.8" marker-end="url(#arrow)"/>
  <text x="945" y="1082" class="small">data flow</text>
  <line x1="1050" y1="1077" x2="1092" y2="1077" stroke="#93a3b2" stroke-width="2.1" stroke-dasharray="8 8" marker-end="url(#arrowMuted)"/>
  <text x="1110" y="1082" class="small">uncertain / auxiliary flow</text>
</svg>
